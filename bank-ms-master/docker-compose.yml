services:

  # ================================
  # MySQL Database
  # ================================
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - banking-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ================================
  # Service Registry (Eureka)
  # ================================
  service-registry:
    build:
      context: ./service-registry
    container_name: service-registry
    restart: always
    ports:
      - "8761:8761"
    networks:
      - banking-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # ================================
  # API Gateway
  # ================================
  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - EUREKA_INSTANCE_PREFERIPADDRESS=true
    depends_on:
      service-registry:
        condition: service_healthy
    networks:
      - banking-network

  # ================================
  # Sequence Generator
  # ================================
  sequence-generator:
    build:
      context: ./sequence-generator
    container_name: sequence-generator
    restart: on-failure
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/sequence_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - EUREKA_INSTANCE_PREFERIPADDRESS=true
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - banking-network

  # ================================
  # User Service
  # ================================
  user-service:
    build:
      context: ./user-service
    container_name: user-service
    restart: on-failure
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/user_service
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - EUREKA_INSTANCE_PREFERIPADDRESS=true
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - banking-network

  # ================================
  # Account Service
  # ================================
  account-service:
    build:
      context: ./account-service
    container_name: account-service
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/account_service
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - EUREKA_INSTANCE_PREFERIPADDRESS=true
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - banking-network

  # ================================
  # Fund Transfer Service
  # ================================
  fund-transfer:
    build:
      context: ./fund-transfer
    container_name: fund-transfer
    restart: on-failure
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/fund_transfer_service
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - EUREKA_INSTANCE_PREFERIPADDRESS=true
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - banking-network

  # ================================
  # Transaction Service
  # ================================
  transaction-service:
    build:
      context: ./transaction-service
    container_name: transaction-service
    restart: on-failure
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/transaction_service
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - EUREKA_INSTANCE_PREFERIPADDRESS=true
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - banking-network

# ================================
# Volumes & Networks
# ================================
volumes:
  mysql_data:

networks:
  banking-network:
    driver: bridge