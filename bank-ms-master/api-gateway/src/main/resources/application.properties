server.port=8080

spring.application.name=api-gateway

# ================= Gateway Routes =================
# Swagger-specific routes REMOVED ? covered by /** routes already

spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/user-service/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/user-service/(?<remaining>.*), /${remaining}

spring.cloud.gateway.routes[1].id=account-service
spring.cloud.gateway.routes[1].uri=lb://account-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/account-service/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/account-service/(?<remaining>.*), /${remaining}

spring.cloud.gateway.routes[2].id=fund-transfer
spring.cloud.gateway.routes[2].uri=lb://fund-transfer
spring.cloud.gateway.routes[2].predicates[0]=Path=/fund-transfer/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/fund-transfer/(?<remaining>.*), /${remaining}

spring.cloud.gateway.routes[3].id=transaction-service
spring.cloud.gateway.routes[3].uri=lb://transaction-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/transaction-service/**
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/transaction-service/(?<remaining>.*), /${remaining}

spring.cloud.gateway.routes[4].id=sequence-generator
spring.cloud.gateway.routes[4].uri=lb://sequence-generator
spring.cloud.gateway.routes[4].predicates[0]=Path=/sequence-generator/**
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/sequence-generator/(?<remaining>.*), /${remaining}

# ================= Eureka =================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ================= Springdoc =================

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true

springdoc.swagger-ui.urls[0].name=User Service
springdoc.swagger-ui.urls[0].url=http://localhost:8080/user-service/v3/api-docs

springdoc.swagger-ui.urls[1].name=Account Service
springdoc.swagger-ui.urls[1].url=http://localhost:8080/account-service/v3/api-docs

springdoc.swagger-ui.urls[2].name=Fund Transfer
springdoc.swagger-ui.urls[2].url=http://localhost:8080/fund-transfer/v3/api-docs

springdoc.swagger-ui.urls[3].name=Transaction Service
springdoc.swagger-ui.urls[3].url=http://localhost:8080/transaction-service/v3/api-docs

springdoc.swagger-ui.urls[4].name=Sequence Generator
springdoc.swagger-ui.urls[4].url=http://localhost:8080/sequence-generator/v3/api-docs